name = "bugfixagent-email-worker"
main = "src/index.ts"
compatibility_date = "2025-06-21"
compatibility_flags = ["nodejs_compat"]

# ── Routes ───────────────────────────────────────────────────────
# Custom domain so the form is reachable from mainland China
# (workers.dev is blocked by the GFW; levelchinese.app routes fine).
routes = [
  { pattern = "contact-ebram.levelchinese.app", custom_domain = true }
]

# After deploying, bind this worker to a catch-all address in the
# Cloudflare Dashboard: Email → Email Routing → Routing Rules.

# ── Environment variables ────────────────────────────────────────
[vars]
BUGFIXAGENT_URL = "https://ebram-production.up.railway.app"
FALLBACK_EMAIL = ""
CONTACT_SUCCESS_REDIRECT = "https://levelchinese.app/contact?success=1"
CONTACT_ERROR_REDIRECT = "https://levelchinese.app/contact?error=1"
CONTACT_TO_EMAIL = "shanhui.dev@proton.me"
CONTACT_FORM_ADMIN_SUBJECT = "LevelChinese News contact form"
MAIL_FROM = "contact@levelchinese.app"
# Set to "1", "on", or "true" to log investigations locally without calling the orchestrator
DEV_TEST_MODE = "0"

# ── Secrets (set via `wrangler secret put`) ──────────────────────
# wrangler secret put EBRAM_API_ACCESS_KEY
# wrangler secret put RESEND_API_KEY

# ── AI (Workers AI — deep spam filter) ──────────────────────
[ai]
binding = "AI"

# ── Observability ────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

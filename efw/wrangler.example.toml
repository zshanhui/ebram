name = "bugfixagent-email-worker"
main = "src/index.ts"
compatibility_date = "2025-06-21"
compatibility_flags = ["nodejs_compat"]

# ── Routes ───────────────────────────────────────────────────────
routes = [
  { pattern = "contact-ebram.ebramforms.com", custom_domain = true }
]

# After deploying, bind this worker to a catch-all address in the
# Cloudflare Dashboard: Email → Email Routing → Routing Rules.

# Bundle ebram.config.yaml (repo root) into the worker at build time.
# The second rule preserves wrangler's default text handling (its warning
# notes custom rules replace the built-in *.txt/*.html/*.sql rules).
rules = [
  { type = "Text", globs = ["**/ebram.config.yaml"], fallthrough = true },
  { type = "Text", globs = ["**/*.txt", "**/*.html", "**/*.sql"], fallthrough = true },
]

# ── Environment variables ────────────────────────────────────────
# change to match your actual urls and config
[vars]
BUGFIXAGENT_URL = "https://your.ebram.orchestrator.url"
FALLBACK_EMAIL = ""
CONTACT_SUCCESS_REDIRECT = "https://ebramforms.com/contact?success=1"
CONTACT_ERROR_REDIRECT = "https://ebramforms.app/contact?error=1"
# Admin inbox for general (non-investigation) inbound mail lives in
# ebram.config.yaml (general.contact_email) — no env var needed.
CONTACT_FORM_ADMIN_SUBJECT = "EbramForms contact form"
MAIL_FROM = "customer@ebramforms.com"
# Set to "1", "on", or "true" to log investigations locally without calling the orchestrator
DEV_TEST_MODE = "0"

# ── Secrets (set via `wrangler secret put`) ──────────────────────
# wrangler secret put EBRAM_API_ACCESS_KEY
# wrangler secret put RESEND_API_KEY

# ── AI (Workers AI — deep spam filter) ──────────────────────
[ai]
binding = "AI"

# ── Observability ────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1
